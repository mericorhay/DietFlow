name: TestFlight

# Signed release build -> archive -> TestFlight, via fastlane.
#
# Same Apple team as CueTake, MicFox and Galapagos (XYB3NLV654), so these six
# hold the same values as in those repos:
#   APPLE_TEAM_ID
#   IOS_DISTRIBUTION_CERT_P12      base64 of the distribution .p12
#   IOS_CERTIFICATE_PASSWORD       password for that .p12
#   APP_STORE_CONNECT_API_KEY      the .p8, raw or base64
#   APP_STORE_CONNECT_API_KEY_ID
#   APP_STORE_CONNECT_ISSUER_ID
# These two are DietFlow's own, because a profile is tied to a bundle id. Both
# profiles must carry the App Group group.com.orhay.dietflow:
#   IOS_PROVISIONING_PROFILE         base64 of the com.orhay.dietflow App Store profile
#   IOS_WIDGET_PROVISIONING_PROFILE  base64 of the com.orhay.dietflow.widget App Store profile
# Optional, for the in-app assistant:
#   DIETFLOW_ASSISTANT_URL, DIETFLOW_ASSISTANT_TOKEN
# Optional, for anonymous usage data (PostHog):
#   POSTHOG_API_KEY, POSTHOG_HOST
on:
  workflow_dispatch:
    inputs:
      groups:
        description: "TestFlight group names, comma separated (optional)"
        required: false
        default: ""

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 70

    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: xcodebuild -version

      - name: Setup Ruby + fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      # Signing assets live in secrets base64-encoded, written under RUNNER_TEMP
      # (wiped when the job ends). All three are validated here rather than letting a
      # bad one surface later: a wrong password and a corrupt base64 blob both
      # come out of `security import` as the same "MAC verification failed".
      - name: Stage and verify signing assets
        env:
          IOS_DISTRIBUTION_CERT_P12: ${{ secrets.IOS_DISTRIBUTION_CERT_P12 }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          IOS_WIDGET_PROVISIONING_PROFILE: ${{ secrets.IOS_WIDGET_PROVISIONING_PROFILE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          echo "$IOS_DISTRIBUTION_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12" 2>/dev/null \
            || { echo "::error::IOS_DISTRIBUTION_CERT_P12 is not valid base64."; exit 1; }
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision" 2>/dev/null \
            || { echo "::error::IOS_PROVISIONING_PROFILE is not valid base64."; exit 1; }
          echo "$IOS_WIDGET_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/widget.mobileprovision" 2>/dev/null \
            || { echo "::error::IOS_WIDGET_PROVISIONING_PROFILE is not valid base64."; exit 1; }

          if ! openssl asn1parse -inform der -in "$RUNNER_TEMP/dist.p12" > /dev/null 2>&1; then
            echo "::error::IOS_DISTRIBUTION_CERT_P12 decoded to $(wc -c < "$RUNNER_TEMP/dist.p12") bytes that are not a PKCS#12 file."
            echo "::error::Re-export the .p12 and base64 it in one line: base64 -i cert.p12 | tr -d '\\n'"
            exit 1
          fi

          if ! openssl pkcs12 -in "$RUNNER_TEMP/dist.p12" -passin env:IOS_CERTIFICATE_PASSWORD -nokeys -noout 2>/dev/null; then
            echo "::error::IOS_CERTIFICATE_PASSWORD does not open IOS_DISTRIBUTION_CERT_P12 (the .p12 is well-formed, so it is the password secret)."
            exit 1
          fi
          echo "Certificate and password verified."

          # macOS's Security framework only speaks the older PKCS#12 encryption
          # algorithms. A .p12 written by OpenSSL 3 defaults to AES-256, which
          # `security import` rejects with that same misleading message.
          openssl pkcs12 -in "$RUNNER_TEMP/dist.p12" -passin env:IOS_CERTIFICATE_PASSWORD \
                         -nodes -out "$RUNNER_TEMP/dist.pem" 2>/dev/null \
            || openssl pkcs12 -legacy -in "$RUNNER_TEMP/dist.p12" -passin env:IOS_CERTIFICATE_PASSWORD \
                              -nodes -out "$RUNNER_TEMP/dist.pem"
          openssl pkcs12 -export -in "$RUNNER_TEMP/dist.pem" \
                         -passout env:IOS_CERTIFICATE_PASSWORD \
                         -legacy -out "$RUNNER_TEMP/dist_legacy.p12" 2>/dev/null \
            || openssl pkcs12 -export -in "$RUNNER_TEMP/dist.pem" \
                              -passout env:IOS_CERTIFICATE_PASSWORD \
                              -out "$RUNNER_TEMP/dist_legacy.p12"
          rm -f "$RUNNER_TEMP/dist.pem"
          echo "Certificate re-encrypted for the macOS keychain."

          # The widget reads the plan out of the App Group container. A profile without the
          # group signs and uploads fine and then ships a widget that is always empty, so
          # check for it here.
          for NAME in app widget; do
            security cms -D -i "$RUNNER_TEMP/$NAME.mobileprovision" > "$RUNNER_TEMP/$NAME.plist" \
              || { echo "::error::The $NAME provisioning profile is not a valid .mobileprovision."; exit 1; }
            if ! /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.security.application-groups' "$RUNNER_TEMP/$NAME.plist" 2>/dev/null | grep -q 'group.com.orhay.dietflow'; then
              echo "::error::The $NAME provisioning profile does not carry the App Group group.com.orhay.dietflow."
              exit 1
            fi
          done
          echo "Provisioning profiles verified."

          echo "IOS_CERT_PATH=$RUNNER_TEMP/dist_legacy.p12" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_PATH=$RUNNER_TEMP/app.mobileprovision" >> "$GITHUB_ENV"
          echo "IOS_WIDGET_PROFILE_PATH=$RUNNER_TEMP/widget.mobileprovision" >> "$GITHUB_ENV"

      # The assistant endpoint is written into the bundle from secrets and never committed.
      # Without both secrets the file is simply not written, and the app shows the assistant
      # as not connected instead of failing the build.
      - name: Assistant endpoint
        env:
          DIETFLOW_ASSISTANT_URL: ${{ secrets.DIETFLOW_ASSISTANT_URL }}
          DIETFLOW_ASSISTANT_TOKEN: ${{ secrets.DIETFLOW_ASSISTANT_TOKEN }}
        run: |
          if [ -n "$DIETFLOW_ASSISTANT_URL" ] && [ -n "$DIETFLOW_ASSISTANT_TOKEN" ]; then
            python3 -c 'import json,os; json.dump({"url": os.environ["DIETFLOW_ASSISTANT_URL"], "appToken": os.environ["DIETFLOW_ASSISTANT_TOKEN"]}, open("DietFlow/Resources/AssistantEndpoint.json","w"))'
            echo "Assistant endpoint written."
          else
            echo "::warning::DIETFLOW_ASSISTANT_URL / DIETFLOW_ASSISTANT_TOKEN not set; the assistant will show as not connected."
          fi

      # PostHog's project key, written into the bundle like the assistant endpoint. Without it the
      # app sends no analytics at all and leaves the switch out of Settings. POSTHOG_HOST is
      # optional (US cloud by default; https://eu.i.posthog.com for an EU project).
      - name: Analytics key
        env:
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_HOST: ${{ secrets.POSTHOG_HOST }}
        run: |
          if [ -n "$POSTHOG_API_KEY" ]; then
            python3 -c 'import json,os; json.dump({"apiKey": os.environ["POSTHOG_API_KEY"], "host": os.environ.get("POSTHOG_HOST") or "https://us.i.posthog.com"}, open("DietFlow/Resources/Analytics.json","w"))'
            echo "Analytics key written."
          else
            echo "::warning::POSTHOG_API_KEY not set; this build sends no analytics."
          fi

      - name: Build and upload to TestFlight
        env:
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: "180"
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: "5"
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          TESTFLIGHT_GROUPS: ${{ inputs.groups }}
        run: bundle exec fastlane beta

      - name: Upload the IPA as an artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: DietFlow-testflight-run${{ github.run_number }}
          path: build/*.ipa
          if-no-files-found: ignore
