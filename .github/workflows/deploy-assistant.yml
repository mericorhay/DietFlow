name: Deploy assistant

# Puts backend/assistant on Cloudflare Workers. Run by hand after a change to the Worker: the app
# talks to whatever is deployed, so a new endpoint does nothing until this has run.
#
# Needs one repository secret, set once (a second is optional):
#   CLOUDFLARE_API_TOKEN   a token from dash.cloudflare.com › My Profile › API Tokens, made from the
#                          "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  only when the token can reach more than one account: the account id shown
#                          on the Workers & Pages overview
# The Worker's own secrets (APP_TOKEN, OPENAI_API_KEY …) stay in Cloudflare and are not touched.

on:
  workflow_dispatch:
  # Also on every push that changes the Worker, so a branch with a new endpoint can be deployed
  # without first reaching the default branch.
  push:
    paths:
      - "backend/assistant/**"
      - ".github/workflows/deploy-assistant.yml"

concurrency:
  group: deploy-assistant
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy the Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Nothing that fails its tests goes live.
      - run: node --test backend/assistant/plan.test.mjs backend/assistant/meals.test.mjs
      - name: Deploy
        working-directory: backend/assistant
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN repository secret first."
            exit 1
          fi
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
          npx --yes wrangler@4 deploy
          # What is configured now (no secrets are printed): the models and whether the token is set.
          url=$(npx --yes wrangler@4 deployments list 2>/dev/null | grep -o 'https://[^ ]*workers.dev' | head -1 || true)
          [ -n "$url" ] && curl -fsS "$url/health" || true
